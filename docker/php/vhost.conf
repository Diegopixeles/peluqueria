<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/Pagina

    # Alias para servir la carpeta php/ desde la URL /php/
    # Necesario porque el DocumentRoot apunta a /Pagina y Apache
    # no sirve carpetas fuera de él sin un Alias explícito.
    Alias /php /var/www/html/php

    # Alias para recursos estáticos: asegura que /style/ e /Imagenes/
    # sean accesibles desde cualquier página (incluidas las de /php/)
    Alias /style   /var/www/html/Pagina/style
    Alias /Imagenes /var/www/html/Pagina/Imagenes

    <Directory /var/www/html/Pagina>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/php>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
